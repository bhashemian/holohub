name: Register or update a source
description: Add an application, module, tutorial, skill, or benchmark to HoloHub, or update or remove an existing registration.
title: "[Registry] "
body:
  - type: markdown
    attributes:
      value: |
        HoloHub records where a project lives; its code, descriptions, and tags stay in the project's own repository. A bot checks this request and opens a pull request for maintainer review.

        To register a new source, fill in the fields below. For how to create one, see the guides for [applications](https://github.com/nvidia-holoscan/holohub/blob/main/applications/README.md#create-a-new-application), [modules](https://github.com/nvidia-holoscan/holohub/blob/main/modules/README.md#create-a-new-module), [tutorials](https://github.com/nvidia-holoscan/holohub/blob/main/tutorials/README.md#create-a-new-tutorial), and [skills](https://github.com/nvidia-holoscan/holohub/blob/main/skills/README.md#create-a-new-skill).

        <!-- registered sources: generated by utilities/registry_requests.py links -->
        **Update or remove** a registered source; choose it to fill in its current values:
        - **Applications:** [holohub-archive](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+application%2Fholohub-archive&kind=application&name=holohub-archive&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholohub.git&ref=archive-4.x&path=applications&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholohub%2Fissues) · [holoscan-applications](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+application%2Fholoscan-applications&kind=application&name=holoscan-applications&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-applications.git&ref=main&path=applications&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-applications%2Fissues)
        - **Modules:** [holoscan-deltacast](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+module%2Fholoscan-deltacast&kind=module&name=holoscan-deltacast&url=https%3A%2F%2Fgithub.com%2Fdeltacasttv%2Fholoscan-modules.git&ref=36deda4f925dfb7aaa69df70459246f154f4dcdd&path=.&issues-url=https%3A%2F%2Fgithub.com%2Fdeltacasttv%2Fholoscan-modules%2Fissues) · [holoscan-finance](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+module%2Fholoscan-finance&kind=module&name=holoscan-finance&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-finance.git&ref=main&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-finance%2Fissues) · [holoscan-sdk-modules](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+module%2Fholoscan-sdk-modules&kind=module&name=holoscan-sdk-modules&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-sdk.git&ref=main&path=modules&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-sdk%2Fissues) · [holoscan-sensor-bridge](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+module%2Fholoscan-sensor-bridge&kind=module&name=holoscan-sensor-bridge&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-sensor-bridge.git&ref=main&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-sensor-bridge%2Fissues)
        - **Tutorials:** [holoscan-tutorials](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+tutorial%2Fholoscan-tutorials&kind=tutorial&name=holoscan-tutorials&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-tutorials.git&ref=main&path=tutorials&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-tutorials%2Fissues)
        - **Skills:** [holoscan-sdk](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+skill%2Fholoscan-sdk&kind=skill&name=holoscan-sdk&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-sdk.git&ref=main&path=skills&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-sdk%2Fissues)
        - **Benchmarks:** [holoscan-benchmarks](https://github.com/nvidia-holoscan/holohub/issues/new?template=registry.yml&title=%5BRegistry%5D+benchmark%2Fholoscan-benchmarks&kind=benchmark&name=holoscan-benchmarks&url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-benchmarks.git&ref=main&path=benchmarks&issues-url=https%3A%2F%2Fgithub.com%2Fnvidia-holoscan%2Fholoscan-benchmarks%2Fissues)
        <!-- end of registered sources -->

        To update a source, you can also enter just its kind, its name, and the fields to change. Blank fields keep their current values, and `none` removes an optional value.
  - type: input
    id: kind
    attributes:
      label: Kind
      description: application, module, tutorial, skill, or benchmark.
      placeholder: application
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: The registered name, or a new one using lowercase letters, numbers, and single hyphens or underscores between words.
      placeholder: my-application
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Source URL
      description: HTTPS Git clone URL, or a direct link to a hosted metadata.json or SKILL.md. Required for a new source.
      placeholder: https://github.com/owner/project.git
  - type: input
    id: ref
    attributes:
      label: Git revision
      description: Required for a Git repository; a branch, a tag, or (most reproducible) a full commit SHA. Leave blank for a hosted metadata.json or SKILL.md, or enter none to switch a registered source to one.
      placeholder: 0123456789abcdef0123456789abcdef01234567
  - type: input
    id: path
    attributes:
      label: Repository path
      description: Optional directory in the Git repository that holds the project or collection. Use "." for the repository root.
      placeholder: applications
  - type: input
    id: issues-url
    attributes:
      label: Issue tracker URL
      description: Optional HTTPS page where users report problems with this source.
      placeholder: https://github.com/owner/project/issues
  - type: checkboxes
    id: remove
    attributes:
      label: Remove
      options:
        - label: Remove this registration from HoloHub. The project itself is not changed.
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Describe the source or the change. When removing a source, link any replacement.
    validations:
      required: true
